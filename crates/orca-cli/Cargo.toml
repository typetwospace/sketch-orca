[package]
name = "orca-cli"
description = "The Rust program, sketch-orca-rs: sketch-orca's commands, intake, declines and crash result"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sketch-orca-rs"
path = "src/main.rs"

[dependencies]
orca-crt = { workspace = true }
orca-fmt = { workspace = true }
orca-stl = { workspace = true }
orca-tbb = { workspace = true }
orca-probe = { workspace = true }
orca-json = { workspace = true }
orca-config = { workspace = true }
# Of phase O2's crates only the placeholder parser for now (the presets' compatibility conditions);
# o2-info adds the other nine when it runs alone, so building this crate never compiles a crate
# another task is filling.
orca-placeholder = { workspace = true }
sha2 = { workspace = true }
windows-sys = { workspace = true }
