[package]
name = "orca-placeholder"
description = "Orca's placeholder parser: the conditions of presets and of custom G-code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Every dependency the crate will need, declared up front (o2-geom, 2026-11-07), so that
# no task of phase O2 that fills a crate changes Cargo.toml or Cargo.lock.
[dependencies]
orca-crt = { workspace = true }
orca-stl = { workspace = true }
orca-fmt = { workspace = true }
orca-config = { workspace = true }

[dev-dependencies]
orca-probe = { workspace = true }
