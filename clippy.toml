# What the engine crates may not call. The C++ engine gets its sorts, selections, heaps, min and max
# from Microsoft's STL and its maths from the static UCRT; the translation reproduces both exactly,
# so each of them has one home, and clippy sends the rest of the code there:
#
#   - sorts, selections, heaps, float min and max: orca-stl (its translation of the STL's
#     algorithms, with their comparator order and their NaN behaviour);
#   - maths functions: orca-crt (one wrapper per UCRT function, so Rust's own maths never answers);
#   - hash containers: orca-stl (MSVC's unordered containers, in MSVC's iteration order).
#
# orca-stl and orca-crt allow these only at their own definitions, with an
# #[allow(clippy::disallowed_methods)] or #[allow(clippy::disallowed_types)] on that one item and a
# comment saying why. Run with `bun run rs:clippy -- -D warnings`.

disallowed-methods = [
    # Sorts and selections: the order of the comparator calls is part of the result.
    { path = "slice::sort", reason = "use orca-stl::stable_sort (std::stable_sort)" },
    { path = "slice::sort_by", reason = "use orca-stl::stable_sort (std::stable_sort)" },
    { path = "slice::sort_by_key", reason = "use orca-stl::stable_sort (std::stable_sort)" },
    { path = "slice::sort_by_cached_key", reason = "use orca-stl::stable_sort (std::stable_sort)" },
    { path = "slice::sort_unstable", reason = "use orca-stl::sort (std::sort)" },
    { path = "slice::sort_unstable_by", reason = "use orca-stl::sort (std::sort)" },
    { path = "slice::sort_unstable_by_key", reason = "use orca-stl::sort (std::sort)" },
    { path = "slice::select_nth_unstable", reason = "use orca-stl::nth_element (std::nth_element)" },
    { path = "slice::select_nth_unstable_by", reason = "use orca-stl::nth_element (std::nth_element)" },
    { path = "slice::select_nth_unstable_by_key", reason = "use orca-stl::nth_element (std::nth_element)" },

    # Float min and max: std::min and std::max with their NaN behaviour, not IEEE minNum and maxNum.
    { path = "f64::min", reason = "use orca-stl::min (std::min)" },
    { path = "f64::max", reason = "use orca-stl::max (std::max)" },
    { path = "f32::min", reason = "use orca-stl::min (std::min)" },
    { path = "f32::max", reason = "use orca-stl::max (std::max)" },

    # Max and min that pick a different element of equals than the STL: Rust's max of two and its
    # iterator max return the last of equal values, std::max and std::max_element the first, and
    # Ord::clamp panics where std::clamp does not.
    { path = "std::iter::Iterator::max", reason = "use orca-stl::max_element (std::max_element keeps the first of equals)" },
    { path = "std::iter::Iterator::max_by", reason = "use orca-stl::max_element_by (std::max_element keeps the first of equals)" },
    { path = "std::iter::Iterator::max_by_key", reason = "use orca-stl::max_element_by (std::max_element keeps the first of equals)" },
    { path = "std::iter::Iterator::min_by_key", reason = "use orca-stl::min_element_by (std::min_element with the C++ comparator)" },
    { path = "std::cmp::max", reason = "use orca-stl::max (std::max returns the first of equals)" },
    { path = "std::cmp::max_by", reason = "use orca-stl::max_by (std::max returns the first of equals)" },
    { path = "std::cmp::max_by_key", reason = "use orca-stl::max_by (std::max returns the first of equals)" },
    { path = "std::cmp::Ord::max", reason = "use orca-stl::max (std::max returns the first of equals)" },
    { path = "std::cmp::Ord::clamp", reason = "use orca-stl::clamp (std::clamp)" },

    # Searches and unique: the C++ engine's comparator calls and the element it keeps.
    { path = "slice::binary_search", reason = "use orca-stl::lower_bound (std::lower_bound)" },
    { path = "slice::binary_search_by", reason = "use orca-stl::lower_bound_by (std::lower_bound)" },
    { path = "slice::binary_search_by_key", reason = "use orca-stl::lower_bound_by (std::lower_bound)" },
    { path = "slice::partition_point", reason = "use orca-stl::lower_bound_by or orca-stl::upper_bound_by (std::lower_bound, std::upper_bound)" },
    { path = "std::vec::Vec::dedup", reason = "use orca-stl::unique_vec (std::unique)" },
    { path = "std::vec::Vec::dedup_by", reason = "use orca-stl::unique_vec_by (std::unique)" },
    { path = "std::vec::Vec::dedup_by_key", reason = "use orca-stl::unique_vec_by (std::unique)" },

    # Maths: the static UCRT's results, through orca-crt.
    { path = "f64::sin", reason = "use orca-crt::sin" },
    { path = "f64::cos", reason = "use orca-crt::cos" },
    { path = "f64::tan", reason = "use orca-crt::tan" },
    { path = "f64::sin_cos", reason = "use orca-crt::sin and orca-crt::cos" },
    { path = "f64::asin", reason = "use orca-crt::asin" },
    { path = "f64::acos", reason = "use orca-crt::acos" },
    { path = "f64::atan", reason = "use orca-crt::atan" },
    { path = "f64::atan2", reason = "use orca-crt::atan2" },
    { path = "f64::sinh", reason = "use orca-crt::sinh" },
    { path = "f64::cosh", reason = "use orca-crt::cosh" },
    { path = "f64::tanh", reason = "use orca-crt::tanh" },
    { path = "f64::asinh", reason = "use orca-crt::asinh" },
    { path = "f64::acosh", reason = "use orca-crt::acosh" },
    { path = "f64::atanh", reason = "use orca-crt::atanh" },
    { path = "f64::exp", reason = "use orca-crt::exp" },
    { path = "f64::exp2", reason = "use orca-crt::exp2" },
    { path = "f64::exp_m1", reason = "use orca-crt::expm1" },
    { path = "f64::ln", reason = "use orca-crt::log" },
    { path = "f64::ln_1p", reason = "use orca-crt::log1p" },
    { path = "f64::log", reason = "use orca-crt::log and a division, as the C++ writes it" },
    { path = "f64::log2", reason = "use orca-crt::log2" },
    { path = "f64::log10", reason = "use orca-crt::log10" },
    { path = "f64::powf", reason = "use orca-crt::pow" },
    { path = "f64::powi", reason = "use orca-crt::pow (the C++ std::pow(double, int) calls pow)" },
    { path = "f64::cbrt", reason = "use orca-crt::cbrt" },
    { path = "f64::hypot", reason = "use orca-crt::hypot" },
    { path = "f64::mul_add", reason = "use orca-crt::fma, or a multiplication and an addition as the C++ writes it" },
    { path = "f32::sin", reason = "use orca-crt::sinf" },
    { path = "f32::cos", reason = "use orca-crt::cosf" },
    { path = "f32::tan", reason = "use orca-crt::tanf" },
    { path = "f32::sin_cos", reason = "use orca-crt::sinf and orca-crt::cosf" },
    { path = "f32::asin", reason = "use orca-crt::asinf" },
    { path = "f32::acos", reason = "use orca-crt::acosf" },
    { path = "f32::atan", reason = "use orca-crt::atanf" },
    { path = "f32::atan2", reason = "use orca-crt::atan2f" },
    { path = "f32::sinh", reason = "use orca-crt::sinhf" },
    { path = "f32::cosh", reason = "use orca-crt::coshf" },
    { path = "f32::tanh", reason = "use orca-crt::tanhf" },
    { path = "f32::asinh", reason = "use orca-crt::asinhf" },
    { path = "f32::acosh", reason = "use orca-crt::acoshf" },
    { path = "f32::atanh", reason = "use orca-crt::atanhf" },
    { path = "f32::exp", reason = "use orca-crt::expf" },
    { path = "f32::exp2", reason = "use orca-crt::exp2f" },
    { path = "f32::exp_m1", reason = "use orca-crt::expm1f" },
    { path = "f32::ln", reason = "use orca-crt::logf" },
    { path = "f32::ln_1p", reason = "use orca-crt::log1pf" },
    { path = "f32::log", reason = "use orca-crt::logf and a division, as the C++ writes it" },
    { path = "f32::log2", reason = "use orca-crt::log2f" },
    { path = "f32::log10", reason = "use orca-crt::log10f" },
    { path = "f32::powf", reason = "use orca-crt::powf" },
    { path = "f32::powi", reason = "use orca-crt::powf (the C++ std::pow(float, int) calls pow)" },
    { path = "f32::cbrt", reason = "use orca-crt::cbrtf" },
    { path = "f32::hypot", reason = "use orca-crt::hypotf" },
    { path = "f32::mul_add", reason = "use orca-crt::fmaf, or a multiplication and an addition as the C++ writes it" },
]

disallowed-types = [
    { path = "std::collections::BinaryHeap", reason = "use orca-stl's heap (std::push_heap and std::pop_heap)" },
    { path = "std::collections::HashMap", reason = "use orca-stl's unordered_map (MSVC's iteration order)" },
    { path = "std::collections::HashSet", reason = "use orca-stl's unordered_set (MSVC's iteration order)" },
]
