# SPDX-License-Identifier: AGPL-3.0-only
#
# The Rust translation of sketch-orca: one Cargo workspace, built by `bun scripts/rust.ts` with
# Rust 1.94.1 inside the pinned MSVC environment (BUILDING.md). Its program is crates/orca-cli's
# sketch-orca-rs, a separate program from the C++ sketch-orca of cli/, under the same licence.
# Every dependency is pinned exactly and declared here once; a crate takes it with
# `workspace = true`. Changing a pin is a task of its own (CONTRIBUTING.md).

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Equal to package.json's version and cli/CMakeLists.txt's SKETCH_ORCA_VERSION (test/repo.test.ts).
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
rayon = "=1.12.0"
sha2 = "=0.11.1"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ErrorReporting",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }

orca-cli = { path = "crates/orca-cli" }
orca-config = { path = "crates/orca-config" }
orca-crt = { path = "crates/orca-crt" }
orca-fmt = { path = "crates/orca-fmt" }
orca-json = { path = "crates/orca-json" }
orca-probe = { path = "crates/orca-probe" }
orca-stl = { path = "crates/orca-stl" }
orca-tbb = { path = "crates/orca-tbb" }

# Phase O2's crates (2026-11-07): each declares every dependency it will need up front, so that the
# tasks that fill them in parallel never change this file or Cargo.lock.
orca-arrange = { path = "crates/orca-arrange" }
orca-eigen = { path = "crates/orca-eigen" }
orca-exact = { path = "crates/orca-exact" }
orca-geom = { path = "crates/orca-geom" }
orca-mesh = { path = "crates/orca-mesh" }
orca-model = { path = "crates/orca-model" }
orca-placeholder = { path = "crates/orca-placeholder" }
orca-qhull = { path = "crates/orca-qhull" }
orca-xml = { path = "crates/orca-xml" }
orca-zip = { path = "crates/orca-zip" }

# Phase O3's crates (orca-o3-skeleton, 2026-11-13), in their build order: each declares every
# library crate of phase O2 and every crate before it here, so that the units that fill them side by
# side never change this file or Cargo.lock (until orca-o3-chain).
orca-index = { path = "crates/orca-index" }
orca-paths = { path = "crates/orca-paths" }
orca-voronoi = { path = "crates/orca-voronoi" }
orca-slice = { path = "crates/orca-slice" }
orca-layer = { path = "crates/orca-layer" }
orca-arachne = { path = "crates/orca-arachne" }
orca-print = { path = "crates/orca-print" }
orca-perimeter = { path = "crates/orca-perimeter" }
orca-surface = { path = "crates/orca-surface" }
orca-fill = { path = "crates/orca-fill" }
orca-support = { path = "crates/orca-support" }
orca-plate = { path = "crates/orca-plate" }
orca-process = { path = "crates/orca-process" }

# No target-cpu: the program runs on any x64 machine and must give the same bytes on all of them.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
